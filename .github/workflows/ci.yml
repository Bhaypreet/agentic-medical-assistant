name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.5,<1.0"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      GROQ_API_KEY: test-dummy-key-for-ci
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The suite mocks every network call, so the heavy vector and OCR
      # dependencies are not installed here - only what the tests import.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.115,<1.0" \
            "pydantic>=2.7,<3.0" \
            "pydantic-settings>=2.3,<3.0" \
            "sqlalchemy>=2.0,<3.0" \
            "slowapi>=0.1.9,<0.2" \
            "python-multipart>=0.0.9,<0.1" \
            "reportlab>=4.2,<5.0" \
            "langgraph>=0.2,<1.0" \
            "requests>=2.32,<3.0" \
            "pytest>=8.2,<9.0" \
            "pytest-cov>=5.0,<8.0" \
            "httpx>=0.27,<1.0"

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=55

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      # Builds without pushing, so a broken Dockerfile is caught on the
      # pull request rather than at deploy time.
      - name: Build image
        run: docker build -t agentic-medical-assistant:ci .
