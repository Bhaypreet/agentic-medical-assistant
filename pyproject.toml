[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-medical-assistant"
version = "1.0.0"
description = "Agentic medical assistant: lab report analysis, symptom triage and clinician lookup"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<0.1",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "slowapi>=0.1.9,<0.2",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "langchain-groq>=0.2,<0.4",
    "langgraph>=0.2,<1.0",
    "groq>=0.11,<1.0",
    "faiss-cpu>=1.8,<2.0",
    "fastembed>=0.3,<1.0",
    "pdfplumber>=0.11,<1.0",
    "pytesseract>=0.3.10,<0.4",
    "Pillow>=10.3,<12.0",
    "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.36,<2.0",
    "plotly>=5.22,<7.0",
    "pandas>=2.2,<4.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", ".venv", "vectorstore", "report_vectorstore"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends()/File() defaults are the documented idiom
]

[tool.ruff.lint.isort]
# The Streamlit app runs from frontendv2/, so these resolve as top-level
# modules there rather than as third-party packages.
known-first-party = ["app", "api", "config", "styles", "components", "utils"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
